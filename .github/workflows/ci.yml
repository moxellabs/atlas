name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install
        run: bun install --frozen-lockfile
      - name: Production dependency audit
        run: bun run audit:production
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun test
      - name: Distribution smoke
        run: bun run smoke:distribution
      - name: Production onboarding UAT
        run: bun run uat:production
      - name: Public artifact boundary guard
        run: bun tooling/scripts/public-artifact-guard.ts
      - name: Public artifact verification
        run: bun apps/cli/src/index.ts artifact verify --fresh
